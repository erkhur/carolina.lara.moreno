<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamor Card</title>

<link rel="icon" type="image/png" href="img/logo_lamor.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* VARIABLES */
:root {
  --bg: linear-gradient(135deg, #1c1c1c, #2f2f2f);
  --card-bg: rgba(255,255,255,0.95);
  --text: #333;
  --accent: #1f3c5a;
}

.dark {
  --bg: linear-gradient(135deg, #0f172a, #020617);
  --card-bg: rgba(15,23,42,0.95);
  --text: #e5e7eb;
  --accent: #60a5fa;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  font-family: 'Montserrat', sans-serif;
  transition: 0.4s;
  padding: 15px;
}

/* CARD */
.card {
  width: 100%;
  max-width: 700px;
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  display: flex;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

.left {
  flex: 2;
  padding: 25px;
}

h1 {
  margin: 0;
  font-weight: 500;
  font-size: 26px;
  color: var(--text);
}

.subtitle {
  margin-top: 8px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}

.info {
  margin-top: 20px;
  line-height: 1.7;
  font-size: 14px;
}

a {
  text-decoration: none;
  color: var(--text);
}

a:hover {
  color: #0077ff;
}

/* BOTONES */
.buttons {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  border: none;
}

.btn-whatsapp {
  background: #25D366;
  color: white;
}

.btn-save {
  background: var(--accent);
  color: white;
}

/* TOGGLE */
.toggle {
  position: fixed;
  top: 15px;
  right: 15px;
  background: var(--card-bg);
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  z-index: 10;
}

/* RIGHT */
.right {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  gap: 15px;
}

.circle {
  background: var(--accent);
  color: white;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
}

/* LOGO */
.logo img {
  width: 130px;
  animation: float 3s ease-in-out infinite;
  mix-blend-mode: multiply;
}

@keyframes float {
  0% {transform: translateY(0);}
  50% {transform: translateY(-6px);}
  100% {transform: translateY(0);}
}

.qr img {
  width: 90px;
}

/* 📱 MOBILE */
@media(max-width:768px){

  .card {
    flex-direction: column;
  }

  .right {
    flex-direction: column;
    padding: 15px;
  }

  .circle {
    width: 110px;
    height: 110px;
    font-size: 11px;
  }

  h1 {
    font-size: 22px;
  }

}

</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙 / ☀️</div>

<div class="card">

  <div class="left">
    <h1>Carolina Lara M.</h1>

    <div class="subtitle">
      AMER Regional <br>
      Operations & Project Manager
    </div>

    <div class="info">
      📞 <a href="https://wa.me/51943232981">+51 943 232 981</a><br>
      📧 <a href="mailto:carolina.lara@lamor.com">carolina.lara@lamor.com</a><br><br>

      📍 <a href="https://www.google.com/maps/search/?api=1&query=Calle+Amador+Merino+Reyna+496+San+Isidro+Lima+Peru">
        Calle Amador Merino Reyna 496 Off 303 <br>
        San Isidro, Lima<br>
        PERÚ
      </a><br><br>

      🌐 <a href="https://www.lamor.com">www.lamor.com</a>
    </div>

    <div class="buttons">
      <button class="btn btn-whatsapp" onclick="openWhatsApp()">WhatsApp</button>
      <button class="btn btn-save" onclick="downloadVCF()">Guardar contacto</button>
    </div>
  </div>

  <div class="right">
    <div class="circle">
      LET´S CLEAN<br>THE WORLD
    </div>

    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://www.lamor.com">
    </div>

    <div class="logo">
      <img src="img/logo_lamor.png" alt="LAMOR">
    </div>
  </div>

</div>

<script>
function toggleMode(){
  document.body.classList.toggle("dark");
}

function openWhatsApp(){
  window.open("https://wa.me/51943232981");
}

function downloadVCF(){
  const vcfData = `BEGIN:VCARD
VERSION:3.0
FN:Carolina Lara
ORG:Lamor
TITLE:Operations & Project Manager
TEL:+51943232981
EMAIL:carolina.lara@lamor.com
ADR:Calle Amador Merino Reyna 496, San Isidro, Lima, Peru
END:VCARD`;

  const blob = new Blob([vcfData], { type: "text/vcard" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "contacto.vcf";
  link.click();
}
</script>

</body>
</html>
